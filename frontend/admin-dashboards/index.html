<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIU QAAT</title>
    <!-- The institution mark sits beside "KIU QAAT" in every browser tab. There was no icon
         at all before, so each tab showed a blank globe next to the name — the one place a
         user picks this app out of fifteen open tabs. Generated from the repo-root logo.png
         and served from public/, which Vite copies into dist/ verbatim. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a7a3f" />
    <!-- Pre-paint brand colours so the very first frame is KIU-green (no black/white
         flash before the app's JS + theme engine load). Kept in sync with brand.json. -->
    <style>
      :root { --app-bg:#f0fdf4; --sidebar:#1a7a3f; --footer:#1a7a3f; --brand:#1a7a3f; }
      html, body { margin:0; background:#f0fdf4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
