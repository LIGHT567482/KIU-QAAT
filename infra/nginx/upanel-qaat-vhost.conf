# Optional drop-in for U-Panel's nginx (config/nginx/upanel-docker.conf).
# Lets Cloudflare Flexible SSL on :80 serve QAAT by Host, so you do not need
# origin port 9080.
#
# On the VPS, after QAAT is up:
#   docker network connect qaat_internal "$(docker ps -qf name=upanel-nginx)"
# Then include this server block in U-Panel nginx and rebuild that image.
#
# Replace the upstream name if your QAAT proxy container is not `qaat-proxy`.

upstream qaat_edge {
    zone qaat_edge 64k;
    server qaat-proxy:80 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name qaat.orion13.us students.orion13.us;

    client_max_body_size 32m;

    location / {
        proxy_pass http://qaat_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
