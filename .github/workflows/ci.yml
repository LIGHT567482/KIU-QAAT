name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Must match the `packageManager` field every package.json declares (pnpm@9.15.9). pnpm
  # refuses to run when the two disagree — ERR_PNPM_BAD_PM_VERSION — so a version pinned
  # here that drifts from the project's own is a hard CI failure, not a warning. Change both
  # together, or not at all.
  PNPM_VERSION: '9.15.9'

jobs:

  # ─── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    name: Auth Service — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qaat_test
          POSTGRES_USER: qaat
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/auth-service/go.sum

      - name: Generate test RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/auth_private.pem 2048
          openssl rsa -in keys/auth_private.pem -pubout -out keys/auth_public.pem
        working-directory: .

      # EVERY migration, in order — not a hand-written list.
      #
      # The list here stopped at 009 while the repository grew to 76, so CI built a schema 67
      # migrations behind the code it was testing. The auth query selects title,
      # registration_number and force_password_change; none of them existed, so login returned
      # 500 "authentication failed" and the tests failed for a reason that had nothing to do
      # with authentication. A glob cannot fall behind.
      - name: Run migrations
        run: |
          set -e
          for f in $(ls ../../db/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # users.tenant_id is a foreign key, so the auth tests' inserts need their institution row to
      # exist first — every one of them was failing on users_tenant_id_fkey.
      #
      # NOT db/seeds/001_test_tenants.sql: that file seeds a1000000…/a2000000…, while these tests
      # use a0000000…0001 and b0000000…0002. Loading it looks like a fix and changes nothing, so
      # the two rows the tests actually name are created here instead. CI-only fixture — no
      # product code, no schema, and nothing multi-institution about it; the second row exists
      # solely so TestLogin_CrossTenantIsBlocked has something to be blocked from.
      - name: Create the tenant rows the auth tests reference
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -c "
            INSERT INTO tenants (tenant_id, name, domain, rsa_key_id) VALUES
              ('a0000000-0000-0000-0000-000000000001', 'CI Test Institution',  'alpha.edu', 'ci-key-a'),
              ('b0000000-0000-0000-0000-000000000002', 'CI Other Institution', 'beta.edu',  'ci-key-b')
            ON CONFLICT (tenant_id) DO NOTHING;"

      - name: Tidy and download dependencies
        run: go mod tidy && go mod download

      - name: Build
        run: go build ./...

      # No -coverprofile. It made the run fail with `go: no such tool "covdata"`, and the file it
      # would have produced was never uploaded, read or reported on by anything — so the flag was
      # costing a red build to generate an artefact nobody consumed. Add it back together with a
      # step that actually publishes the result, if coverage is wanted.
      - name: Test
        run: go test ./... -race -count=1
        env:
          DB_URL: postgres://qaat:testpass@localhost:5432/qaat_test?sslmode=disable
          REDIS_URL: redis://:@localhost:6379/0
          RSA_PRIVATE_KEY_PATH: ../../keys/auth_private.pem
          RSA_PUBLIC_KEY_PATH:  ../../keys/auth_public.pem
          JWT_ISSUER: qaat-auth
          JWT_AUDIENCE: qaat-api
          JWT_TTL_SECONDS: "3600"
          PORT: "8081"
          # Login seals a per-device binding key with this, so without it every successful
          # sign-in returned 500 "could not establish device binding" — a required variable
          # that the job simply never set. A throwaway 32-byte hex value is right for CI: it
          # encrypts nothing that outlives the run.
          KEY_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # ─── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/api-gateway/go.sum

      - name: Generate test RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/auth_private.pem 2048
          openssl rsa -in keys/auth_private.pem -pubout -out keys/auth_public.pem
        working-directory: .

      - name: Tidy and download dependencies
        run: go mod tidy && go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1
        env:
          DB_URL: postgres://qaat:testpass@localhost:5432/qaat_test?sslmode=disable
          REDIS_URL: redis://:@localhost:6379/0
          RSA_PUBLIC_KEY_PATH: ../../keys/auth_public.pem
          JWT_ISSUER: qaat-auth
          JWT_AUDIENCE: qaat-api
          PORT: "8443"
          CORS_ORIGINS: "http://localhost:3000"

  # (Coordinator PWA removed — coordinators now use the native Android app.)

  # ─── Admin Dashboards ────────────────────────────────────────────────────────
  admin-dashboards:
    name: Admin Dashboards — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-dashboards

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/admin-dashboards/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # ─── Database ───────────────────────────────────────────────────────────────
  db-migrations:
    name: DB Migrations — apply & verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qaat_test
          POSTGRES_USER: qaat
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      # Named "Apply all migrations" while listing nine of seventy-six. It now applies all of
      # them, so this job tests the schema the code actually runs against — which is the entire
      # point of a migrations job.
      - name: Apply all migrations
        run: |
          set -e
          for f in $(ls db/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          PGPASSWORD: testpass

      - name: Verify RLS is ENABLED and FORCED on all tenant tables
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -c "
            SELECT relname
            FROM pg_class
            WHERE relkind = 'r'
              AND relnamespace = 'public'::regnamespace
              AND relname NOT IN ('tenants')
              AND (NOT relrowsecurity OR NOT relforcerowsecurity);
          " | grep -q "(0 rows)" || (echo "RLS not ENABLED+FORCED on all tables!" && exit 1)

      - name: Ensure qaat_app cannot bypass RLS
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -tAc "
            SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='qaat_app';
          " | grep -qx "f" || (echo "qaat_app must be NOSUPERUSER + NOBYPASSRLS!" && exit 1)

      - name: Load seed data
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test \
            -f db/seeds/001_test_tenants.sql \
            -f db/seeds/002_test_users.sql

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tests/security/go.sum

      # The isolation suite MUST run as the same NON-superuser role the app uses
      # (qaat_app), against the seeded multi-tenant data — otherwise it passes
      # vacuously. This is the regression gate for update.md C1.
      - name: RLS isolation tests (as qaat_app)
        run: go test ./... -count=1 -v
        working-directory: tests/security
        env:
          DB_URL: postgres://qaat_app:changeme_app@localhost:5432/qaat_test?sslmode=disable
