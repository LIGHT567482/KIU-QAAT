name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Must match the `packageManager` field every package.json declares (pnpm@9.15.9). pnpm
  # refuses to run when the two disagree — ERR_PNPM_BAD_PM_VERSION — so a version pinned
  # here that drifts from the project's own is a hard CI failure, not a warning. Change both
  # together, or not at all.
  PNPM_VERSION: '9.15.9'

jobs:

  # ─── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    name: Auth Service — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qaat_test
          POSTGRES_USER: qaat
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/auth-service/go.sum

      - name: Generate test RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/auth_private.pem 2048
          openssl rsa -in keys/auth_private.pem -pubout -out keys/auth_public.pem
        working-directory: .

      # EVERY migration, in order — not a hand-written list.
      #
      # The list here stopped at 009 while the repository grew to 76, so CI built a schema 67
      # migrations behind the code it was testing. The auth query selects title,
      # registration_number and force_password_change; none of them existed, so login returned
      # 500 "authentication failed" and the tests failed for a reason that had nothing to do
      # with authentication. A glob cannot fall behind.
      - name: Run migrations
        run: |
          set -e
          for f in $(ls ../../db/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # users.tenant_id is a foreign key, so the auth tests' inserts need their institution row to
      # exist first — every one of them was failing on users_tenant_id_fkey.
      #
      # NOT db/seeds/001_test_tenants.sql: that file seeds a1000000…/a2000000…, while these tests
      # use a0000000…0001 and b0000000…0002. Loading it looks like a fix and changes nothing, so
      # the two rows the tests actually name are created here instead. CI-only fixture — no
      # product code, no schema, and nothing multi-institution about it; the second row exists
      # solely so TestLogin_CrossTenantIsBlocked has something to be blocked from.
      - name: Create the tenant rows the auth tests reference
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -c "
            INSERT INTO tenants (tenant_id, name, domain, rsa_key_id) VALUES
              ('a0000000-0000-0000-0000-000000000001', 'CI Test Institution',  'alpha.edu', 'ci-key-a'),
              ('b0000000-0000-0000-0000-000000000002', 'CI Other Institution', 'beta.edu',  'ci-key-b')
            ON CONFLICT (tenant_id) DO NOTHING;"

      - name: Tidy and download dependencies
        run: go mod tidy && go mod download

      - name: Build
        run: go build ./...

      # No -coverprofile. It made the run fail with `go: no such tool "covdata"`, and the file it
      # would have produced was never uploaded, read or reported on by anything — so the flag was
      # costing a red build to generate an artefact nobody consumed. Add it back together with a
      # step that actually publishes the result, if coverage is wanted.
      - name: Test
        run: go test ./... -race -count=1
        env:
          DB_URL: postgres://qaat:testpass@localhost:5432/qaat_test?sslmode=disable
          REDIS_URL: redis://:@localhost:6379/0
          RSA_PRIVATE_KEY_PATH: ../../keys/auth_private.pem
          RSA_PUBLIC_KEY_PATH:  ../../keys/auth_public.pem
          JWT_ISSUER: qaat-auth
          JWT_AUDIENCE: qaat-api
          JWT_TTL_SECONDS: "3600"
          PORT: "8081"
          # Login seals a per-device binding key with this, so without it every successful
          # sign-in returned 500 "could not establish device binding" — a required variable
          # that the job simply never set. A throwaway 32-byte hex value is right for CI: it
          # encrypts nothing that outlives the run.
          KEY_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # ─── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/api-gateway/go.sum

      - name: Generate test RSA keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/auth_private.pem 2048
          openssl rsa -in keys/auth_private.pem -pubout -out keys/auth_public.pem
        working-directory: .

      - name: Tidy and download dependencies
        run: go mod tidy && go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1
        env:
          DB_URL: postgres://qaat:testpass@localhost:5432/qaat_test?sslmode=disable
          REDIS_URL: redis://:@localhost:6379/0
          RSA_PUBLIC_KEY_PATH: ../../keys/auth_public.pem
          JWT_ISSUER: qaat-auth
          JWT_AUDIENCE: qaat-api
          PORT: "8443"
          CORS_ORIGINS: "http://localhost:3000"

  # (Coordinator PWA removed — coordinators now use the native Android app.)

  # ─── Admin Dashboards ────────────────────────────────────────────────────────
  admin-dashboards:
    name: Admin Dashboards — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-dashboards

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/admin-dashboards/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  coordinator-android:
    name: Coordinator App — engine & app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/coordinator-android

    # WHY THIS JOB EXISTS. The phone is where attendance is actually taken — the room code, the
    # lecturer gate, the check-in validator, the combined-class code, the eviction policy that
    # decides whether a lecture hall drains or stalls. All of it has unit tests, and until now none
    # of them ran here: CI tested the Go services and the dashboards and simply never opened the
    # Android project. A regression in the engine reached a hall before it reached a build log.
    #
    # Only the JVM suites run. Nothing here needs a device or an emulator, so the job stays fast
    # enough to sit on every push; instrumentation tests are a separate problem and not this one.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties IS checked in (against its own advice) and points at one developer's home
      # directory, which does not exist on a runner — so it must be overwritten, not merely supplied.
      # ANDROID_HOME is set on the ubuntu-latest images. The overwrite is confined to the runner's
      # checkout and never travels back.
      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Engine + app unit tests
        run: ./gradlew :engine:test :app:testDebugUnitTest --no-daemon --stacktrace

      # The compile step the unit tests do not cover on their own: resource linking and packaging.
      # A Compose screen that builds but cannot be packaged is still a broken release.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-android-test-reports
          path: |
            frontend/coordinator-android/engine/build/reports/tests/
            frontend/coordinator-android/app/build/reports/tests/

  # ─── Database ───────────────────────────────────────────────────────────────
  db-migrations:
    name: DB Migrations — apply & verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qaat_test
          POSTGRES_USER: qaat
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      # Named "Apply all migrations" while listing nine of seventy-six. It now applies all of
      # them, so this job tests the schema the code actually runs against — which is the entire
      # point of a migrations job.
      - name: Apply all migrations
        run: |
          set -e
          for f in $(ls db/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          PGPASSWORD: testpass

      - name: Verify RLS is ENABLED with a policy on all tenant tables
        run: |
          # ENABLED + a policy. NOT forced — and the difference locked an institution out of its
          # own system, so it is worth spelling out.
          #
          # This check used to demand relforcerowsecurity. FORCE applies a table's policies to its
          # OWNER too, and the owner is what the auth-service, the sync-receiver and the admin
          # handlers connect as. On managed Postgres that role is not a superuser, so forcing it
          # meant `SELECT COUNT(*) FROM users` returned 0 and nobody could sign in. Locally the
          # owner IS a superuser and ignores RLS entirely, so the assertion passed on every machine
          # it was written on. See migration 082.
          #
          # What actually protects tenants is the policy binding qaat_app — the non-owner role the
          # gateway serves tenant traffic with — and that is asserted for real by the isolation
          # suite below, which runs AS qaat_app against seeded multi-tenant data.
          #
          # Counted, not grepped for "(0 rows)": the old form depended on psql's human-readable
          # formatting, so a pager or a locale change could fail a green build or pass a broken
          # one. -tA returns the bare number. It also NAMES the offenders before failing.
          missing=$(PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -tA -c "
            SELECT COUNT(*)::int
            FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r' AND n.nspname = 'public'
              -- tenants is the tenant REGISTRY (isolating it would hide the row a connection
              -- must resolve BEFORE it can set app.current_tenant); schema_migrations is the
              -- migrator's ledger; scheduled_job_runs is the scheduler's own bookkeeping. None
              -- of the three is tenant data.
              AND c.relname NOT IN ('tenants', 'schema_migrations', 'scheduled_job_runs')
              -- AND the table must actually HAVE a tenant to isolate. The single-institution
              -- migrations drop tenant_id from tables that no longer need it and disable RLS in
              -- the same breath — a table with RLS on and no policy denies every row to qaat_app,
              -- so the two must move together. Fourteen tables have been through that already.
              -- Demanding a tenant policy on a table with no tenant column asks for a policy that
              -- could not be written, so this follows the column rather than a list somebody has
              -- to remember to update: de-tenant a table tomorrow and CI stays honest by itself.
              AND EXISTS (SELECT 1 FROM information_schema.columns col
                           WHERE col.table_schema = 'public'
                             AND col.table_name = c.relname
                             AND col.column_name = 'tenant_id')
              AND (NOT c.relrowsecurity
                   OR NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid));")
          if [ "$missing" != "0" ]; then
            echo "RLS not ENABLED, or no policy, on $missing table(s):"
            PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -c "
              SELECT c.relname AS table_name, c.relrowsecurity AS enabled,
                     (SELECT COUNT(*) FROM pg_policy p WHERE p.polrelid = c.oid) AS policies
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind = 'r' AND n.nspname = 'public'
                AND c.relname NOT IN ('tenants', 'schema_migrations', 'scheduled_job_runs')
                AND EXISTS (SELECT 1 FROM information_schema.columns col
                             WHERE col.table_schema = 'public'
                               AND col.table_name = c.relname
                               AND col.column_name = 'tenant_id')
                AND (NOT c.relrowsecurity
                     OR NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid))
              ORDER BY c.relname;"
            exit 1
          fi
          echo "RLS enabled with a policy on every tenant table."

      - name: Ensure qaat_app cannot bypass RLS
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -tAc "
            SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='qaat_app';
          " | grep -qx "f" || (echo "qaat_app must be NOSUPERUSER + NOBYPASSRLS!" && exit 1)

      # db/seeds/*.sql were RETIRED when KIU became single-institution — the product must not
      # ship demo tenants. This step went on naming two of them and would fail outright on a
      # missing file. The isolation suite still needs two tenants to have anything to prove, so
      # the fixture now lives with the test that needs it. ON_ERROR_STOP because a fixture that
      # half-loads produces exactly the vacuous pass this suite already suffered from.
      - name: Load the two-tenant isolation fixture
        run: |
          PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test \
            -v ON_ERROR_STOP=1 -f tests/security/fixture.sql

      # A fixture that silently loaded nothing would let every assertion below pass by counting
      # zero of everything — which is how this gate came to be green while testing nothing.
      - name: Verify the fixture actually landed
        run: |
          for t in users sessions attendance_logs students_extended courses course_units venues; do
            n=$(PGPASSWORD=testpass psql -h localhost -U qaat -d qaat_test -tA -c \
              "SELECT COUNT(DISTINCT tenant_id) FROM $t
                WHERE tenant_id IN ('a0000000-0000-0000-0000-000000000001',
                                    'b0000000-0000-0000-0000-000000000002');")
            if [ "$n" != "2" ]; then
              echo "$t holds rows for $n of the 2 fixture tenants — isolation cannot be proved."
              exit 1
            fi
          done
          echo "Both fixture tenants present in every isolated table." 

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tests/security/go.sum

      # The isolation suite MUST run as the same NON-superuser role the app uses
      # (qaat_app), against the seeded multi-tenant data — otherwise it passes
      # vacuously. This is the regression gate for update.md C1.
      - name: RLS isolation tests (as qaat_app)
        run: go test ./... -count=1 -v
        working-directory: tests/security
        env:
          DB_URL: postgres://qaat_app:changeme_app@localhost:5432/qaat_test?sslmode=disable
